<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a3a8c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ONE Victory">
<title>ONE Victory Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, field-ready sales tool — numbers first, one action per screen
   IDEA: the dealer target card a salesman hands across the counter
   PICTURE: big "need X more" figures, hero rectangles for the 1V measures
   COLOUR and TYPE: CelcomDigi deep blue + yellow accent on white; Plus Jakarta Sans
   LAYOUT: top bar, scope chips, card grid; bottom tab bar on phones */
:root{color-scheme:light dark;
--blue:#0a3a8c;--blue2:#1557c9;--yel:#ffc20e;--yel2:#fff3c4;
--bg:light-dark(#f3f6fb,#0b1220);--card:light-dark(#fff,#131c2e);--ink:light-dark(#0f1a2e,#e8edf6);
--mut:light-dark(#5b6880,#9aa7bd);--line:light-dark(#e2e8f2,#24304a);--soft:light-dark(#eef3fc,#18233a);
--ok:#12805c;--okb:light-dark(#e3f6ee,#11362b);--bad:#c2381f;--badb:light-dark(#fdeae5,#3a1a14);--warn:#a66a00}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
input,select{font-size:16px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);width:100%}
input:focus,select:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--blue2) 45%,transparent);outline-offset:1px}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:0;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none;white-space:nowrap}
.btn.y{background:var(--yel);color:#1b1b1b}.btn.g{background:#1f9d55}.btn.o{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.hide{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--blue) 0 55%,var(--bg) 55%)}
.lcard{width:min(400px,100%);background:var(--card);border-radius:20px;padding:28px;box-shadow:0 20px 50px #0a3a8c33}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;white-space:nowrap}
.mark{width:38px;height:38px;border-radius:11px;background:conic-gradient(from 200deg,var(--yel) 0 40%,var(--blue2) 40% 100%);position:relative;flex:none}
.mark::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--card)}
.lcard h1{font-size:26px;line-height:1.1;margin:18px 0 4px}
.lcard label,.flab{display:block;font-size:13px;color:var(--mut);margin:14px 0 4px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
.demo{margin-top:16px;font-size:13px;color:var(--mut);background:var(--soft);border-radius:10px;padding:10px 12px}
header.top{background:var(--blue);color:#fff;padding:14px max(4vw,16px) 18px}
.toprow{display:flex;align-items:center;gap:12px;justify-content:space-between;max-width:1240px;margin:auto}
.toprow .brand .mark::after{background:var(--blue)}
.who{max-width:1240px;margin:12px auto 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:end}
.who h2{margin:0;font-size:clamp(22px,4vw,30px);line-height:1.1}
.who small{opacity:.8;display:block}
.asof{background:#ffffff1f;border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.asof b{color:var(--yel)}
nav.tabs{max-width:1240px;margin:14px auto 0;display:flex;gap:6px;overflow-x:auto}
nav.tabs button{background:transparent;border:0;color:#cfe0ff;font-weight:700;padding:10px 14px;border-radius:10px;min-height:44px;cursor:pointer;white-space:nowrap}
nav.tabs button.on{background:#fff;color:var(--blue)}
nav.tabs .ts{display:none}
.iconbtn{background:#ffffff1f;border:0;color:#fff;border-radius:10px;min-height:40px;padding:0 12px;cursor:pointer;font-weight:600}
main{max-width:1240px;margin:auto;padding:18px max(4vw,16px) 90px}
.banner{background:var(--yel2);color:#3d2f00;border-left:4px solid var(--yel);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.bar>div{flex:1 1 200px}.bar label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
.sec{margin:22px 0 10px;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.sec h3{margin:0;font-size:18px}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--blue2);white-space:nowrap}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.bad{background:var(--badb);color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.kpi{cursor:pointer;text-align:left;width:100%;display:block;font:inherit;color:inherit}
.kpi:hover{border-color:var(--blue2)}
.kpi .lab{font-size:13px;color:var(--mut);font-weight:600}
.kpi .val{font-size:32px;font-weight:800;line-height:1.1;margin:4px 0}
.kpi .val small{font-size:15px;color:var(--mut);font-weight:600}
.more{font-size:12px;color:var(--blue2);font-weight:700;margin-top:8px}
.meter{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:var(--blue2);border-radius:9px}
.meter i.ok{background:var(--ok)}.meter i.y{background:var(--yel)}
.kline{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);gap:8px}
.kline b{color:var(--ink)}
.hist{display:flex;gap:6px;margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.hist span{flex:1;font-size:12px;color:var(--mut);text-align:center}.hist span b{display:block;color:var(--ink);font-size:14px}
.hero{grid-column:1/-1;background:var(--blue);border-color:var(--blue);color:#fff;padding:20px 22px}
.hero .lab{color:#cfe0ff;font-size:15px}.hero .val{font-size:clamp(44px,8vw,64px)}.hero .val small{color:#cfe0ff;font-size:20px}
.hero .kline,.hero .hist span{color:#cfe0ff}.hero .kline b,.hero .hist span b{color:#fff}.hero .hist span b{font-size:18px}
.hero .meter{background:#ffffff2e;height:12px}.hero .meter i{background:var(--yel)}.hero .meter i.ok{background:#4ade80}
.hero .more{color:var(--yel)}.hero:hover{border-color:var(--yel)}
.hero .kline{font-size:15px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.summary .card{padding:14px}.summary .v{font-size:26px;font-weight:800}
.mix{display:flex;height:34px;border-radius:10px;overflow:hidden;margin:10px 0}
.mix div{display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden}
.mixg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.mixg>div{background:var(--soft);border-radius:12px;padding:10px 14px}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--mut);font-weight:700;background:var(--soft)}
.scroll{overflow-x:auto}
.xl{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.xl table{font-size:13px}.xl th,.xl td{border:1px solid var(--line);padding:7px 9px}
.xl thead th{position:sticky;top:0;z-index:2}
.xl td:first-child,.xl th:first-child{position:sticky;left:0;background:var(--card);z-index:1;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.xl thead th:first-child{z-index:3;background:var(--soft)}
.xl tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--soft) 60%,var(--card))}
.xl tbody tr:hover td{background:var(--yel2);color:#1b1b1b;cursor:pointer}
.xl tfoot td{font-weight:800;background:var(--soft);position:sticky;bottom:0}
.hit{color:var(--ok);font-weight:800}
.tierg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:700px){.tierg{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dl{display:flex;flex-direction:column;gap:8px}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 140px 110px;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.drow:hover{border-color:var(--blue2)}
.drow .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .cd{font-size:12px;color:var(--mut)}
@media(max-width:600px){.drow{grid-template-columns:minmax(0,1fr) 96px}.drow .pp{display:none}}
.dhead{background:var(--blue);color:#fff;border-radius:18px;padding:18px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.dhead h3{margin:0;font-size:22px;line-height:1.15}
.dhead .codes{font-size:13px;opacity:.85;margin-top:6px}
.unlock{border-radius:16px;padding:18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.unlock .big{font-size:56px;font-weight:800;line-height:1}
.unlock .l1{font-size:19px;font-weight:800;line-height:1.25}
.unlock .l2{font-size:15px;margin-top:4px}
.unlock .l3{font-size:15px;margin-top:8px;font-weight:600}
.unlock.ok{background:var(--okb);color:var(--ok)}.unlock.no{background:var(--yel2);color:#4a3600}
.plan b{font-size:15px}.plan small{font-size:12px;color:var(--mut);margin-left:4px}
.pnow{background:var(--blue);color:#fff;border-radius:16px;padding:16px 20px;display:flex;gap:24px;flex-wrap:wrap;align-items:baseline}
.pnow span{font-size:15px;color:#cfe0ff}.pnow b{font-size:clamp(36px,7vw,52px);line-height:1;color:#fff;margin-right:6px}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px;margin-top:10px}
.tier{border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.tier.hit{border-color:var(--ok);background:var(--okb)}.tier.next{border-color:var(--yel)}
.tier .amt{font-size:22px;font-weight:800}
.tier .need{font-size:14px;margin-top:6px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--card);border-radius:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.sheet img{width:100%;border-radius:12px;border:1px solid var(--line)}
textarea{width:100%;min-height:170px;font:14px/1.45 inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fig{position:relative;min-height:260px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.slot{border:1px dashed var(--line);border-radius:12px;padding:10px;font-size:13px}
.slot.on{border-style:solid;border-color:var(--ok);background:var(--okb)}
.slot b{display:block;font-size:15px}
.log{font-size:13px;background:var(--soft);border-radius:10px;padding:10px;white-space:pre-wrap;max-height:200px;overflow:auto}
.tinput{width:76px;min-height:36px;padding:4px 6px;text-align:right;font-size:14px}
.tform{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.tform label{display:block;background:var(--soft);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
.tform input{margin-top:6px}
.tform small{display:block;color:var(--mut);font-weight:500;font-size:12px;margin-top:4px}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:38px;padding:0 14px;font-weight:700;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--blue);box-shadow:0 1px 3px #0002}
.sugg{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.logo{height:40px;max-width:180px;object-fit:contain;display:block}
.lcard .logo{height:56px;max-width:240px}
.toprow .logo{height:38px;background:#fff;border-radius:8px;padding:3px 6px}
.hn{display:flex;gap:6px;margin-top:10px}
.hn span{flex:1;border-radius:10px;padding:6px 8px;text-align:center;font-size:12px;font-weight:700;background:var(--soft);color:var(--mut)}
.hn span b{display:block;font-size:21px;font-weight:800;color:var(--ink);line-height:1.15}
.hn .g{background:var(--okb);color:var(--ok)}.hn .g b{color:var(--ok)}.hn .r{background:var(--badb);color:var(--bad)}.hn .r b{color:var(--bad)}.hn .a{background:var(--yel2);color:#6b4d00}.hn .a b{color:#6b4d00}
.hero .hn span{background:#ffffff1f;color:#cfe0ff}.hero .hn span b{color:#fff;font-size:28px}.hero .hn .g b{color:#4ade80}.hero .hn .r b{color:#ffb4a3}.hero .hn .a b{color:var(--yel)}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}.chk input{width:22px;min-height:22px;flex:none}
.plist .drow{grid-template-columns:minmax(0,1fr) auto}
.code{font-size:24px;font-weight:800;letter-spacing:.3px}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px;margin-top:8px}
.lg div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--card)}
.lg b{font-size:17px;overflow-wrap:anywhere}.lg small{display:block;color:var(--mut);font-size:12px}
.va{background:var(--yel2);color:#3d2f00;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.va b{font-size:20px;letter-spacing:.5px}
.kv{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.kv span{flex:0 0 170px;color:var(--mut);font-size:13px}.kv b{flex:1;font-size:18px;overflow-wrap:anywhere}
.ownc .kv:last-child{border-bottom:0}.ownc .va{margin-top:8px;border-bottom:0}.ownc .va span{color:#6b4d00}
.ltab td,.ltab th{padding:8px 10px}.role-owner{background:var(--blue);color:#fff}.role-supervisor{background:var(--yel2);color:#6b4d00}.role-sales{background:var(--soft);color:var(--blue2)}
@media(max-width:600px){.kv span{flex-basis:100%}.ltab td:last-child,.ltab th:last-child{display:none}.ltab td,.ltab th{padding:8px 6px;font-size:14px}}
.ltab th{text-align:left}
.sysh{font-size:13px;font-weight:800;color:var(--blue2);margin-top:12px}
.lcard.hide{display:none}
#loading{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 85%,transparent);display:grid;place-items:center;z-index:40}
#loading>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 22px;display:flex;gap:12px;align-items:center}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--soft);border-top-color:var(--blue2);animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(1turn)}}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#0f1a2e;color:#fff;padding:10px 16px;border-radius:10px;z-index:30;font-size:14px}
.note{font-size:12px;color:var(--mut);margin-top:8px}
@media(max-width:700px){
 nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--card);border-top:1px solid var(--line);z-index:10;justify-content:space-around;padding:6px}
 nav.tabs button{color:var(--mut);font-size:13px;padding:8px 4px;flex:1}
 nav.tabs .tl{display:none}nav.tabs .ts{display:inline}
 nav.tabs button.on{background:var(--soft);color:var(--blue)}
}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kpi{padding:12px}.kpi .val{font-size:24px}.kpi .val small{font-size:13px}.hist span b{font-size:13px}.kline{font-size:12px}.hero .val{font-size:46px}.hero .kline{font-size:14px}}
@media(prefers-reduced-motion:no-preference){.meter i{transition:width .5s ease}}
</style>
</head>
<body>

<section id="login">
  <form class="lcard" id="lform">
    <div class="brandslot"></div>
    <h1>Open Channel Dashboard</h1>
    <div style="color:var(--mut);font-size:14px">Performance Tracker • Central Region</div>
    <label for="lid">User ID</label><input id="lid" autocomplete="username" required>
    <label for="lpw">Password</label><input id="lpw" type="password" autocomplete="current-password" required>
    <div class="err" id="lerr"></div>
    <button class="btn" style="width:100%;margin-top:6px">Log in</button>
  </form>
  <form class="lcard hide" id="sform">
    <div class="brandslot"></div>
    <h1>First-time setup</h1>
    <div style="color:var(--mut);font-size:14px">Create the admin login. Enter the setup code you received.</div>
    <label for="scode">Setup code</label><input id="scode" required autocomplete="off">
    <label for="sid">Admin user ID</label><input id="sid" required value="admin" autocomplete="username">
    <label for="sname">Full name</label><input id="sname" required>
    <label for="semail">Email</label><input id="semail" type="email" required>
    <label for="spw">Password (min. 6)</label><input id="spw" type="password" required autocomplete="new-password">
    <div class="err" id="sferr"></div>
    <button class="btn" style="width:100%;margin-top:6px">Create admin &amp; log in</button>
  </form>
</section>

<section id="app" class="hide">
  <header class="top">
    <div class="toprow">
      <div class="brandslot"></div>
      <div style="display:flex;gap:8px"><button class="iconbtn" id="bpw">Password</button><button class="iconbtn" id="bout">Log out</button></div>
    </div>
    <div class="who">
      <div><small id="greet"></small><h2 id="uname"></h2><small id="umail"></small></div>
      <span class="asof">Data as of <b id="asof"></b></span>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="main"></main>
</section>
<div id="modal"></div>
<div id="loading" class="hide"><div><span class="spin"></span><b id="loadmsg">Loading…</b></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
{
/* ---------- utilities ---------- */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null||isNaN(n)?'–':Math.round(n).toLocaleString('en-MY');
const rm=n=>'RM '+fmt(n);
const pct=n=>n!=null&&isFinite(n)?Math.round(n*100)+'%':'–';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mlab=m=>{const[y,mm]=m.split('-');return MON[+mm-1]+' '+y.slice(2)};
const dlab=d=>{const x=new Date(d+'T00:00:00');return x.getDate()+' '+MON[x.getMonth()]+' '+x.getFullYear()};
const ymOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ov:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'p:'+s}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2600)}

/* ---------- data helpers ---------- */
function val(d,j,k){const h=d.h[j];if(!h)return 0;return h[DATA.keys.indexOf(k)]||0}
function has(d,j){return j>=0&&!!d.h[j]}
function tierIdx(post,dev){let t=-1;S.rates.tiers.forEach((x,i)=>{if(post>=x.ga&&dev>=x.dev)t=i});return t}
function agg(list,j){
  const a={n:list.length};for(const k of DATA.keys)a[k]=0;
  Object.assign(a,{tp1:0,mtp1:0,gtp1:0,tp1v:0,ptp1:0,ptp3:0,ptp1v:0,devtp:0,sitp:0,t0:0,t1:0,t2:0,t3:0});
  for(const d of list){if(!has(d,j))continue;
    for(const k of DATA.keys)a[k]+=val(d,j,k);
    if(val(d,j,'aw')>=1)a.tp1++; if(val(d,j,'mk')>0)a.mtp1++; if(val(d,j,'mig')>=1)a.gtp1++;
    if(val(d,j,'mk')>=S.rates.unlock)a.tp1v++;
    const p=val(d,j,'post'),dv=val(d,j,'dev'),t=tierIdx(p,dv);
    if(p>=1)a.ptp1++; if(p>=3)a.ptp3++; if(t>=0){a.ptp1v++;a['t'+t]++}
    if(dv>=1)a.devtp++; if(val(d,j,'si')>=1)a.sitp++;}
  return a}
/* per-dealer view of every measure: value shown, and hit test for TP measures */
function dcell(d,j,k){
  if(!has(d,j))return{v:null,t:'–'};
  const U=S.rates.unlock,p=val(d,j,'post'),dv=val(d,j,'dev');
  const hitR={tp1:['aw',x=>x>=1],mtp1:['mk',x=>x>0],gtp1:['mig',x=>x>=1],tp1v:['mk',x=>x>=U],ptp1:['post',x=>x>=1],ptp3:['post',x=>x>=3],devtp:['dev',x=>x>=1],sitp:['si',x=>x>=1]};
  if(hitR[k]){const v=val(d,j,hitR[k][0]);return{v,t:fmt(v),hit:hitR[k][1](v)}}
  if(k==='ptp1v'||/^t\d$/.test(k)){const ti=tierIdx(p,dv);const hit=k==='ptp1v'?ti>=0:ti===+k[1];return{v:p,t:`${p} / ${dv}`,hit}}
  const v=val(d,j,k);return{v,t:fmt(v)}}
const RULE={tp1:'Prepaid GA ≥1',mtp1:'Msian GA (IU>30) ≥1',gtp1:'Migrant GA ≥1',tp1v:'≥40 Msian GA (IU>30)',ptp1:'Postpaid GA ≥1',ptp3:'Postpaid GA ≥3',devtp:'Device GA ≥1',sitp:'Sell In ≥1',ptp1v:'Postpaid GA / Device GA, hit RM400 tier or above',t0:'Postpaid GA / Device GA, highest tier RM400',t1:'Postpaid GA / Device GA, highest tier RM850',t2:'Postpaid GA / Device GA, highest tier RM1,800',t3:'Postpaid GA / Device GA, highest tier RM2,700'};
function inScope(scope){
  if(scope==='ALL')return DATA.dealers;
  const[t,v]=scope.split('|');
  return DATA.dealers.filter(d=>t==='SS'?d.ss===v:t==='SE'?d.se===v:d.cl===v)}
function scopeOptions(){
  const sc=USER.role==='admin'?'ALL':USER.scope;const base=inScope(sc);const o=[];
  if(sc==='ALL')o.push(['ALL','All Central Region']);
  for(const s of [...new Set(base.map(d=>d.ss))].sort()){if(sc==='ALL'||sc.startsWith('SS|'))o.push(['SS|'+s,'SS · '+s]);
    for(const e of [...new Set(base.filter(d=>d.ss===s).map(d=>d.se))].sort())o.push(['SE|'+e,'   SE · '+e]);}
  for(const c of [...new Set(base.map(d=>d.cl))].sort())o.push(['CL|'+c,'Cluster · '+c]);
  return o}
const scopeName=sc=>sc==='ALL'?'All Central Region':sc.replace('|',' · ');
function target(scope,m,k){
  const T=S.targets[m]||{};const t=T[scope];
  if(t&&t[k]!=null&&t[k]!=='')return +t[k];
  if(scope.startsWith('SS|')||scope==='ALL'){const ses=[...new Set(inScope(scope).map(d=>d.se))];let s=0,any=false;
    for(const e of ses){const x=(T['SE|'+e]||{})[k];if(x!=null&&x!==''){s+=+x;any=true}}return any?s:null}
  if(scope.startsWith('CL|')){const ses=[...new Set(inScope(scope).map(d=>d.se))];if(ses.length===1)return target('SE|'+ses[0],m,k)}
  return null}

/* ---------- incentive ---------- */
function dealerCalc(d,j){
  const R=S.rates,g={mvp:'gmvp',hvp:'ghvp',uhvp:'guhvp'};
  const rows=['mvp','hvp','uhvp'].map(k=>{const ms=val(d,j,k),mg=val(d,j,g[k]);return{k,ms,mg,base:ms*R.base[k][0]+mg*R.base[k][1],ov:ms*R.ov[k][0]+mg*R.ov[k][1]}});
  const tot={ms:0,mg:0,base:0,ov:0};rows.forEach(x=>{for(const q in tot)tot[q]+=x[q]});
  const need=Math.max(0,R.unlock-tot.ms),post=val(d,j,'post'),dev=val(d,j,'dev');
  const tiers=R.tiers.map(t=>{const needDev=Math.max(0,t.dev-dev);return{...t,needDev,needGa:Math.max(0,t.ga-post,needDev),hit:post>=t.ga&&dev>=t.dev}});
  return{rows,tot,need,unlocked:need===0,post,dev,si:val(d,j,'si'),tiers,hitT:tiers.filter(t=>t.hit).pop()||null,next:tiers.find(t=>!t.hit)||null}}
const needTxt=t=>t.hit?'Achieved':`Need ${t.needGa} GA${t.needDev?` (incl. ${t.needDev} Device)`:''}`;

/* ---------- canvas report renderer (photo for WhatsApp) ---------- */
function drawReport({kicker,title,sub,head,widths,rows,foot}){
  const W=1080,P=44,RH=54,F='"Plus Jakarta Sans",Arial,sans-serif';
  const cv=document.createElement('canvas'),x=cv.getContext('2d');
  x.font=`800 46px ${F}`;const tl=wrap(x,title,W-2*P);
  const top=120+tl.length*56+50;const H=top+30+RH+rows.length*RH+90;cv.width=W;cv.height=H;
  x.fillStyle='#f3f6fb';x.fillRect(0,0,W,H);x.fillStyle='#0a3a8c';x.fillRect(0,0,W,top);x.fillStyle='#ffc20e';x.fillRect(0,top,W,8);
  x.fillStyle='#ffc20e';x.font=`800 28px ${F}`;x.fillText(kicker,P,70);
  x.fillStyle='#fff';x.font=`800 46px ${F}`;tl.forEach((l,i)=>x.fillText(l,P,130+i*56));
  x.fillStyle='#cfe0ff';x.font=`500 26px ${F}`;x.fillText(sub,P,top-34);
  const tw=W-2*P,cols=widths.map(w=>w*tw),cx=[];let acc=P;cols.forEach(c=>{cx.push(acc);acc+=c});
  let y=top+30;x.fillStyle='#fff';x.beginPath();x.roundRect(P-12,y,tw+24,RH*(rows.length+1)+12,18);x.fill();
  const cell=(t,i,yy,font,color,al)=>{x.font=font;x.fillStyle=color;const w=cols[i]-14;let s=String(t??'');while(s.length>1&&x.measureText(s).width>w)s=s.slice(0,-2)+'…';
    if(al==='l'||i===0){x.textAlign='left';x.fillText(s,cx[i],yy)}else{x.textAlign='right';x.fillText(s,cx[i]+cols[i]-6,yy)}};
  head.forEach((h,i)=>cell(h,i,y+38,`700 22px ${F}`,'#5b6880'));y+=RH;
  rows.forEach((r,ri)=>{
    if(r.sec){x.fillStyle='#eef3fc';x.fillRect(P-12,y+4,tw+24,RH-6);x.textAlign='left';x.fillStyle='#0a3a8c';x.font=`800 26px ${F}`;x.fillText(r.sec,P,y+38);y+=RH;return}
    if(ri%2){x.fillStyle='#f7f9fd';x.fillRect(P-12,y+2,tw+24,RH-2)}
    r.cells.forEach((c,i)=>cell(c,i,y+37,`${r.bold||i>0?700:500} 25px ${F}`,r.colors&&r.colors[i]||'#0f1a2e',r.align&&r.align[i]));y+=RH});
  x.textAlign='left';x.fillStyle='#5b6880';x.font=`500 22px ${F}`;x.fillText(foot,P,H-36);
  return cv}
function wrap(x,t,w){const out=[];let line='';for(const word of String(t).split(' ')){const s=line?line+' '+word:word;if(x.measureText(s).width>w&&line){out.push(line);line=word}else line=s}out.push(line);return out.slice(0,3)}

function shareModal({cv,text,file}){
  const url=cv.toDataURL('image/png');let F=null;cv.toBlob(b=>{F=new File([b],file,{type:'image/png'})},'image/png');

function parseProfiles(wb){

  for(const k of['did','name','uid','role','src'])if(c[k]==null)throw new Error('Column not found: '+k);
  const S_=v=>v==null?'':typeof v==='number'?String(Math.round(v)):String(v).trim(),top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0]?.[0]||'',ORD={Owner:0,Supervisor:1,Sales:2};
  const G=new Map();

    for(const k of['se','ss','sm'])if(c[k]!=null){const v=S_(r[c[k]]);g[k][v]=(g[k][v]||0)+1}
    if(c.on!=null&&!g.ow&&(S_(r[c.on])||S_(r[c.brn]))) g.ow={n:S_(r[c.on]),ic:c.ic!=null?S_(r[c.ic]):'',brn:c.brn!=null?S_(r[c.brn]):'',tin:c.tin!=null?S_(r[c.tin]):''};
    const code=S_(r[c.did]);let cd=g.codes.get(code);if(!cd){cd={c:code,va:'',st:c.dst!=null?S_(r[c.dst]):'',l:[]};g.codes.set(code,cd)}
    const va=c.va!=null?S_(r[c.va]):'';if(va&&va!=='0')cd.va=va;

/* --- xlsx upload parser: finds headers by name --- */
const MAP={pre:'TOTAL PREPAID GA',mig:'MIGRANT GA',ms:'MSIAN GA',aw:'AWIU7 SUBS',mk:'MSIAN IU7>=RM30',lvp:'MSIAN IU7 <RM30',mvp:'MSIAN IU7 >=RM30-44',hvp:'MSIAN IU7 >=RM45-54',uhvp:'MSIAN IU7 >=RM55',gmvp:'MIGRANT IU7 >=RM30-44',ghvp:'MIGRANT IU7 >=RM45-54',guhvp:'MIGRANT IU7 >=RM55',post:'POSTPAID GA TTL',mpost:'MIGRANT POSTPAID GA',dev:'POSTPAID DEVICE GA',pmj:'DEVICE PMJ',si:'DEVICE SELL IN'};
const ym=v=>{if(v instanceof Date)return ymOf(v);if(typeof v==='number'&&v>40000&&v<60000){const d=XLSX.SSF.parse_date_code(v);return d.y+'-'+String(d.m).padStart(2,'0')}return null};
function parseBook(wb,want){
  for(const sn of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null});
    const hr=rows.slice(0,15).findIndex(r=>r&&r.some(x=>String(x??'').trim()==='DIGI DLR CODE'));if(hr<0)continue;
    const hdr=rows[hr],lab=rows[hr-1]||[],sec=rows[1]||[],idx={};hdr.forEach((v,i)=>{if(v!=null&&!ym(v))idx[String(v).trim()]=i});
    const groups=[];let cur=null,prev=null;
    hdr.forEach((v,i)=>{const m=ym(v);if(m||v==='MOM'){if(!cur||(m&&prev&&m<=prev)){cur={cols:[],label:null,sec:sec[i]};groups.push(cur)}cur.cols.push([i,m]);if(lab[i])cur.label=String(lab[i]).replace(/\s+/g,' ').trim();if(sec[i]&&!cur.sec)cur.sec=sec[i];if(m)prev=m}else{cur=null;prev=null}});
    const col={};for(const[k,l]of Object.entries(MAP))for(const g of groups)if(g.sec==='CD'&&g.label===l)for(const[c,m]of g.cols)if(m===want&&col[k]==null)col[k]=c;
    const inFile=[...new Set(groups.flatMap(g=>g.cols.map(c=>c[1])).filter(Boolean))].sort();
    if(!Object.keys(col).length)return{sheet:sn,inFile,out:[],found:[]};
    const g=(r,n)=>idx[n]!=null&&r[idx[n]]!=null?String(r[idx[n]]).trim():'';const out=[];
    for(const r of rows.slice(hr+1)){if(!r||!g(r,'DEALER NAME'))continue;
      out.push({info:{n:g(r,'DEALER NAME'),xd:g(r,'DIGI DLR CODE'),xc:g(r,'CELCOM OUTLET ID'),se:g(r,'SE'),ss:g(r,'SS'),sm:g(r,'SM'),cl:g(r,'CLUSTER'),hq:g(r,'HQ/BRANCH')},
        v:DATA.keys.map(k=>{if(col[k]==null)return null;const x=parseFloat(r[col[k]]);return isNaN(x)?0:Math.round(x)})})}
    return{sheet:sn,inFile,out,found:Object.keys(col)}}
  throw new Error('No sheet with a "DIGI DLR CODE" header found')}

  if(t.id==='logof'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,480/im.width,160/im.height),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.logo=c.toDataURL('image/png');saveSetting('logo',S.logo).then(x=>{renderShell();x&&toast('Logo saved')})};im.src=fr.result};fr.readAsDataURL(t.files[0])}
  if(t.dataset.feat){S.features[t.dataset.feat]=t.checked;saveSetting('features',S.features).then(x=>{renderShell();x&&toast('Saved')})}
  if(t.id==='fban'){S.banner=t.value;saveSetting('banner',S.banner).then(x=>x&&toast('Saved'))}
});
let qT;document.addEventListener('input',e=>{const id=e.target.id;if(!['oq','dq','tq','pq'].includes(id))return;clearTimeout(qT);
  qT=setTimeout(()=>{VIEW[id==='oq'?'q':id]=e.target.value;const pos=e.target.selectionStart;render(true);const i=$('#'+id);if(i){i.focus();i.setSelectionRange(pos,pos)}},250)});
document.addEventListener('submit',async e=>{
  if(e.target.id==='uform'){e.preventDefault();const id=$('#nid').value.trim().toLowerCase();if(S.users.some(u=>u.id===id)){toast('User ID already exists');return}
    try{busy(true,'Creating user…');await api('create',{login_id:id,name:$('#nname').value.trim(),email:$('#nmail').value.trim(),password:$('#npw').value,role:$('#nrole').value,scope:$('#nrole').value==='admin'?'ALL':$('#nscope').value});await loadUsers();busy(false);render(true);toast('User created')}catch(err){busy(false);toast(err.message)}}
  if(e.target.id==='pwform'){e.preventDefault();if($('#pwn').value.length<6){$('#pwerr').textContent='Use at least 6 characters';return}
    const chk=await SB.auth.signInWithPassword({email:`${USER.id}@${DOMAIN}`,password:$('#pwo').value});if(chk.error){$('#pwerr').textContent='Current password is wrong';return}
    const{error}=await SB.auth.updateUser({password:$('#pwn').value});if(error){$('#pwerr').textContent=error.message;return}$('#modal').innerHTML='';toast('Password changed')}
});
function pwDialog(){$('#modal').innerHTML=`<div class="modal"><form class="sheet" id="pwform"><b style="font-size:17px">Change my password</b>
  <label class="flab">Current password</label><input id="pwo" type="password" required>
  <label class="flab">New password</label><input id="pwn" type="password" required>
  <div class="err" id="pwerr"></div><div class="row"><button class="btn">Save</button><button type="button" class="btn o" id="mclose">Cancel</button></div></form></div>`}
function infoDialog(h,b){$('#modal').innerHTML=`<div class="modal"><div class="sheet"><b style="font-size:17px">${h}</b><p>${b}</p><button class="btn" id="mclose">OK</button></div></div>`}

async function enter(user){
  const{data:me,error}=await withTimeout(SB.from('app_users').select('*').eq('id',user.id).maybeSingle(),20000,'No reply from server. Check internet and try again.');
  if(error||!me){await SB.auth.signOut();throw new Error('This login has no access. Ask your admin.')}
  USER={uid:me.id,id:me.login_id,name:me.name,email:me.email||'',role:me.role,scope:me.scope};
  busy(true,'Loading your data…');try{await loadAll()}finally{busy(false)}
  TAB=!DATA.months.length&&USER.role==='admin'?'admin':'perf';VIEW={};$('#login').classList.add('hide');$('#app').classList.remove('hide');renderShell()}
$('#lform').addEventListener('submit',async e=>{e.preventDefault();$('#lerr').textContent='';const btn=$('#lform button');if(btn.disabled)return;btn.disabled=true;
  const id=$('#lid').value.trim().toLowerCase();busy(true,'Logging in…');
  try{const{data,error}=await withTimeout(SB.auth.signInWithPassword({email:`${id}@${DOMAIN}`,password:$('#lpw').value}),20000,'No reply from server. Check internet and try again.');
    if(error){busy(false);$('#lerr').textContent='Wrong user ID or password';return}
    await withTimeout(enter(data.user),60000,'Loading took too long. Check internet and try again.')}
  catch(err){busy(false);$('#lerr').textContent=err.message||String(err)}
  finally{btn.disabled=false}});
$('#sform').addEventListener('submit',async e=>{e.preventDefault();$('#sferr').textContent='';const id=$('#sid').value.trim().toLowerCase();
  try{busy(true,'Creating admin…');await api('bootstrap',{code:$('#scode').value,login_id:id,name:$('#sname').value.trim(),email:$('#semail').value.trim(),password:$('#spw').value});
    const{data,error}=await SB.auth.signInWithPassword({email:`${id}@${DOMAIN}`,password:$('#spw').value});if(error)throw error;busy(false);$('#sform').classList.add('hide');$('#lform').classList.remove('hide');await enter(data.user)}
  catch(err){busy(false);$('#sferr').textContent=err.message||String(err)}});
(async()=>{
  try{const{data}=await SB.from('settings').select('value').eq('key','logo').maybeSingle();S.logo=data?.value||null}catch(_){}
  brand();
  try{const st=await api('status');if(st.needsSetup){$('#lform').classList.add('hide');$('#sform').classList.remove('hide');return}}catch(_){}
  let session=null;try{session=(await withTimeout(SB.auth.getSession(),8000,'t')).data.session}catch(_){}
  if(session)try{await withTimeout(enter(session.user),60000,'Loading took too long. Please log in again.')}catch(err){busy(false);$('#lerr').textContent=err.message||String(err)}
})();
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
